<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phaser Trapezoid Mesh Test</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>

    <script>
        class MainScene extends Phaser.Scene {
            constructor() {
                super("MainScene");
            }

            create() {
                this.cameras.main.setBackgroundColor("#1b1b1b");

                this.add.text(20, 20, "Trapezoidal Mesh Demo", {
                    fontSize: "28px",
                    color: "#ffffff"
                });

                this.add.text(20, 58, "Left / Right arrows adjust top inset", {
                    fontSize: "18px",
                    color: "#cccccc"
                });

                this.createBrickTexture();
                this.topInset = 90;
                this.wallWidth = 420;
                this.wallHeight = 260;

                this.createExitWallMesh();
            }

            createBrickTexture() {
                const g = this.add.graphics();

                g.fillStyle(0x8b3f2b, 1);
                g.fillRect(0, 0, 256, 256);

                const brickW = 64;
                const brickH = 32;

                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 5; col++) {
                        const offset = (row % 2) ? brickW / 2 : 0;
                        const x = col * brickW - offset;
                        const y = row * brickH;

                        g.fillStyle(0xa54f36, 1);
                        g.fillRect(x + 1, y + 1, brickW - 2, brickH - 2);

                        g.lineStyle(2, 0x5c2418, 1);
                        g.strokeRect(x + 1, y + 1, brickW - 2, brickH - 2);
                    }
                }

                g.generateTexture("wall", 256, 256);
                g.destroy();
            }

            createExitWallMesh() {
                const centerX = this.scale.width * 0.5;
                const centerY = this.scale.height * 0.56;

                this.exitWallMesh = this.add.mesh(centerX, centerY, "wall");
                this.exitWallMesh.setDepth(2);
                this.exitWallMesh.hideCCW = false;

                this.outline = this.add.graphics().setDepth(3);

                this.rebuildMesh();
            }

            rebuildMesh() {
                const hw = this.wallWidth * 0.5;
                const hh = this.wallHeight * 0.5;
                const inset = Phaser.Math.Clamp(this.topInset, 0, hw - 20);

                // IMPORTANT: x, y, z triplets
                const vertices = [
                    -hw + inset, -hh, 0,   // 0 top-left
                    hw - inset, -hh, 0,   // 1 top-right
                    hw, hh, 0,   // 2 bottom-right
                    -hw, hh, 0    // 3 bottom-left
                ];

                const uvs = [
                    0, 0,
                    1, 0,
                    1, 1,
                    0, 1
                ];

                const indices = [
                    0, 1, 2,
                    0, 2, 3
                ];

                this.exitWallMesh.clear();
                this.exitWallMesh.addVertices(vertices, uvs, indices, true);

                this.drawOutline(inset);
            }

            drawOutline(inset) {
                const x = this.exitWallMesh.x;
                const y = this.exitWallMesh.y;
                const hw = this.wallWidth * 0.5;
                const hh = this.wallHeight * 0.5;

                this.outline.clear();
                this.outline.lineStyle(4, 0xffff66, 1);
                this.outline.strokePoints([
                    new Phaser.Geom.Point(x - hw + inset, y - hh),
                    new Phaser.Geom.Point(x + hw - inset, y - hh),
                    new Phaser.Geom.Point(x + hw, y + hh),
                    new Phaser.Geom.Point(x - hw, y + hh)
                ], true);
            }

            update() {
                const left = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.LEFT);
                const right = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.RIGHT);

                let changed = false;

                if (left.isDown) {
                    this.topInset -= 2;
                    changed = true;
                }

                if (right.isDown) {
                    this.topInset += 2;
                    changed = true;
                }

                if (changed) {
                    this.rebuildMesh();
                }
            }
        }

        const config = {
            type: Phaser.WEBGL,
            parent: "game-container",
            width: 800,
            height: 600,
            backgroundColor: "#222222",
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            scene: [MainScene]
        };

        new Phaser.Game(config);
    </script>
</body>

</html>
